groups:
  - name: task-tracker-alerts
    rules:
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space is below 15%"
          description: "Only {{ $value | printf \"%.1f\" }}% of the root disk is free."

      - alert: ApiDown
        expr: probe_success{job="api-health"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API is down"
          description: "The /health endpoint has failed for more than 1 minute."