name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the code
        uses: actions/checkout@v6

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        working-directory: app
        run: pip install -r requirements.txt pytest

      - name: Run tests
        working-directory: app
        run: python -m pytest tests -q

  terraform-check:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch the code
        uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Check formatting
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Initialize without a backend
        working-directory: infra
        run: terraform init -backend=false -input=false

      - name: Validate
        working-directory: infra
        run: terraform validate
  build-push:
    name: Build and push image
    runs-on: ubuntu-24.04
    needs: [lint-test, terraform-check]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/api
      PUBLISH: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - name: Fetch the code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    name: Deploy to server
    runs-on: ubuntu-24.04
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DEPLOY_ENABLED == 'true'
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Fetch the code
        uses: actions/checkout@v6

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST_KEY: ${{ secrets.SERVER_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SERVER_HOST_KEY" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host target
            HostName $SERVER_HOST
            User deployer
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy deployment files
        run: |
          ssh target "mkdir -p /home/deployer/app/nginx"
          scp docker-compose.yml target:/home/deployer/app/docker-compose.yml
          scp nginx/nginx.conf target:/home/deployer/app/nginx/nginx.conf

      - name: Deploy
        run: ssh target "IMAGE_TAG=${{ github.sha }} bash -s" < scripts/deploy.sh

      - name: Verify from the outside
        run: curl -fsS --retry 10 --retry-delay 5 --retry-connrefused "http://$SERVER_HOST/health"

      - name: Record the deployed version
        run: echo "Deployed commit ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"